# Builds the Docker image and pushes it to Docker Hub for every version tag:
#   git tag v1.2.0 && git push origin v1.2.0
# publishes <user>/simple-ocpp:1.2.0, :1.2, :1 and :latest.
#
# Needs, under the repository's Settings → Secrets and variables → Actions:
#   variable DOCKERHUB_USERNAME   your Docker Hub user name
#   secret   DOCKERHUB_TOKEN      a Docker Hub access token with Read, Write, Delete access
#                                 (Delete is needed to update the Docker Hub description)

name: Docker image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # also allow a manual run from the Actions tab

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  docker:
    needs: test  # never publish a version whose tests fail
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/simple-ocpp
    steps:
      - uses: actions/checkout@v4

      - name: Image tags from the git tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # v1.2.0 -> 1.2.0, 1.2, 1 and latest (latest only for the highest
          # version, and not for pre-releases such as v1.3.0-rc1)
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/setup-qemu-action@v3   # to build for arm64 on an amd64 runner
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64  # PCs/servers and Raspberry Pi 4/5
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Use the README as the Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          short-description: OCPP 1.6-J central system for home EV chargers, with a web interface
