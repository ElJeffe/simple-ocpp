<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chargers</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<script src="/common.js"></script>
</head>
<body>
<header>
  <h1>Chargers</h1>
  <span id="updated"></span>
</header>
<main id="list"></main>
<dialog id="remove-dialog">
  <form method="dialog">
    <h2>Remove charger <span id="remove-name"></span>?</h2>
    <p>It disappears from the Chargers page. If it connects again, it comes back as a new charger.</p>
    <p>Its charge sessions and energy history can be kept, so they still count in the Sessions and Energy
      pages, or deleted.</p>
    <div class="dialog-actions">
      <button value="cancel" class="secondary">Cancel</button>
      <button value="keep" class="secondary">Remove, keep history</button>
      <button value="delete" class="danger-solid">Remove and delete history</button>
    </div>
  </form>
</dialog>
<script src="/app.js"></script>
</body>
</html>
